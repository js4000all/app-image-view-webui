name: UI Build and E2E

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  frontend-build:
    if: github.event_name == 'push' || !startsWith(github.event.pull_request.title, 'docs:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies (OpenAPI export)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run consolidated API flow verification (quick)
        run: ./scripts/verify_spa_api_flow.sh quick

      - name: Commit bundled artifact to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- static/home-app frontend/openapi/openapi.json frontend/src/generated/api; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/home-app frontend/openapi/openapi.json frontend/src/generated/api
          git commit -m "chore: update generated SPA artifacts [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Verify generated artifacts are up-to-date (push/main and external PR)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code -- static/home-app frontend/openapi/openapi.json frontend/src/generated/api

  ui-e2e:
    if: github.event_name == 'push' || !startsWith(github.event.pull_request.title, 'docs:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run UI E2E tests
        run: pytest tests/e2e -q
